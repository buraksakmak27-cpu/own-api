<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>own-api · Panel</title>
<style>
  :root {
    --bg: #0d1017;
    --surface: #151a23;
    --surface-2: #1c2230;
    --border: #262e3e;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #6c8cff;
    --accent-2: #8f6cff;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2040 0%, transparent 60%), var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-weight: 800; font-size: 18px; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header p { color: var(--muted); font-size: 13px; }

  .search {
    display: flex; gap: 10px; padding: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .search select, .search input, .search button {
    font: inherit; color: var(--text); border: 1px solid var(--border);
    background: var(--surface-2); border-radius: 10px; padding: 12px 14px; outline: none;
  }
  .search select { min-width: 140px; cursor: pointer; }
  .search input { flex: 1; font-size: 15px; }
  .search input:focus, .search select:focus { border-color: var(--accent); }
  .search button {
    border: none; cursor: pointer; font-weight: 600; padding: 12px 26px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    transition: filter .15s, transform .05s;
  }
  .search button:hover { filter: brightness(1.1); }
  .search button:active { transform: translateY(1px); }
  .search button:disabled { opacity: .6; cursor: wait; }

  .status { min-height: 22px; margin: 14px 4px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card h2 {
    font-size: 14px; font-weight: 600; padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .card h2 span { color: var(--muted); font-weight: 400; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); padding: 12px 18px; background: var(--surface-2); cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text); }
  td { padding: 12px 18px; border-top: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: rgba(108,140,255,.06); }
  td.price { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.price.best { color: var(--ok); }
  .badge {
    display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: rgba(108,140,255,.14); color: var(--accent); text-transform: capitalize;
  }
  .empty { padding: 40px 18px; text-align: center; color: var(--muted); font-size: 14px; }

  .recent { list-style: none; max-height: 560px; overflow-y: auto; }
  .recent li {
    padding: 12px 18px; border-top: 1px solid var(--border); cursor: pointer; transition: background .15s;
  }
  .recent li:first-child { border-top: none; }
  .recent li:hover { background: var(--surface-2); }
  .recent .q { font-weight: 600; font-size: 14px; }
  .recent .meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; }
  .recent .min { color: var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">oa</div>
    <div>
      <h1>own-api Panel</h1>
      <p>Kendi Chrome'unuz üzerinden canlı fiyat araması · sonuçlar Vault'a kaydedilir</p>
    </div>
  </header>

  <form class="search" id="searchForm">
    <select id="site" title="Site"><option value="trendyol">trendyol</option></select>
    <input id="query" type="text" placeholder="Ne arıyorsunuz? (örn. saat)" autocomplete="off" autofocus>
    <button id="searchBtn" type="submit">Ara</button>
  </form>
  <div class="status" id="status"></div>

  <div class="grid">
    <section class="card">
      <h2>Sonuçlar <span id="resultMeta"></span></h2>
      <table>
        <thead>
          <tr>
            <th data-sort="name">Ürün Adı</th>
            <th data-sort="price">Fiyat</th>
            <th data-sort="site">Site</th>
          </tr>
        </thead>
        <tbody id="results">
          <tr><td colspan="3" class="empty">Aramak için yukarıya bir kelime yazın.</td></tr>
        </tbody>
      </table>
    </section>

    <aside class="card">
      <h2>Son Aramalar <span id="recentMeta"></span></h2>
      <ul class="recent" id="recent"><li class="empty">Yükleniyor...</li></ul>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmtPrice = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" });
const fmtDate = new Intl.DateTimeFormat("tr-TR", { dateStyle: "short", timeStyle: "short" });

let rows = [];
let sortKey = null, sortAsc = true;

function setStatus(text, kind = "", loading = false) {
  const el = $("status");
  el.className = "status " + kind;
  el.replaceChildren();
  if (loading) { const s = document.createElement("div"); s.className = "spinner"; el.append(s); }
  el.append(document.createTextNode(text));
}

function toNumber(v) {
  if (typeof v === "number") return v;
  if (v && typeof v === "object") return toNumber(v.value ?? v.price);
  if (typeof v !== "string") return null;
  let t = v.replace(/[^\d.,]/g, "");
  if (t.includes(",") && t.includes(".")) {
    t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  } else if (/^\d{1,3}([.,]\d{3})+$/.test(t)) {
    t = t.replace(/[.,]/g, "");          // "12.499" → binlik ayracı
  } else t = t.replace(",", ".");
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : null;
}

function td(text, cls) {
  const cell = document.createElement("td");
  if (cls) cell.className = cls;
  cell.textContent = text;   // textContent → site verisinden HTML enjeksiyonu olmaz
  return cell;
}

function renderResults() {
  const body = $("results");
  body.replaceChildren();
  if (!rows.length) {
    const tr = document.createElement("tr");
    const c = td("Sonuç bulunamadı.", "empty"); c.colSpan = 3;
    tr.append(c); body.append(tr);
    return;
  }
  const sorted = [...rows];
  if (sortKey) {
    sorted.sort((a, b) => {
      const x = sortKey === "price" ? (a.priceNum ?? Infinity) : String(a[sortKey] ?? "");
      const y = sortKey === "price" ? (b.priceNum ?? Infinity) : String(b[sortKey] ?? "");
      const r = typeof x === "number" ? x - y : x.localeCompare(y, "tr");
      return sortAsc ? r : -r;
    });
  }
  const prices = rows.map(r => r.priceNum).filter(p => p != null);
  const min = prices.length ? Math.min(...prices) : null;

  for (const r of sorted) {
    const tr = document.createElement("tr");
    tr.append(td(r.name ?? "—"));
    const priceText = r.priceNum != null ? fmtPrice.format(r.priceNum) : (r.price ?? "—");
    tr.append(td(priceText, "price" + (r.priceNum != null && r.priceNum === min ? " best" : "")));
    const siteCell = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "badge"; badge.textContent = r.site;
    siteCell.append(badge); tr.append(siteCell);
    body.append(tr);
  }
}

document.querySelectorAll("th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.sort;
    sortAsc = sortKey === k ? !sortAsc : true;
    sortKey = k;
    renderResults();
  });
});

async function search(site, q) {
  $("searchBtn").disabled = true;
  setStatus(`${site} üzerinde "${q}" aranıyor... (Chrome açılıyor, birkaç saniye sürebilir)`, "", true);
  try {
    const resp = await fetch(`/api/${encodeURIComponent(site)}/search?q=${encodeURIComponent(q)}`);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
    rows = (data.results || []).map(r => ({ ...r, site: data.site, priceNum: toNumber(r.price) }));
    sortKey = null;
    renderResults();
    const prices = rows.map(r => r.priceNum).filter(p => p != null);
    $("resultMeta").textContent = prices.length
      ? `${rows.length} ürün · en ucuz ${fmtPrice.format(Math.min(...prices))}` : `${rows.length} ürün`;
    setStatus(`✓ ${data.count} sonuç bulundu, ${data.saved} kayıt Vault'a eklendi.`, "ok");
    loadRecent();
  } catch (e) {
    setStatus(`✗ Arama başarısız: ${e.message}`, "err");
  } finally {
    $("searchBtn").disabled = false;
  }
}

async function loadRecent() {
  const list = $("recent");
  try {
    const resp = await fetch("/api/vault/recent?limit=30");
    const items = await resp.json();
    list.replaceChildren();
    $("recentMeta").textContent = items.length ? `${items.length}` : "";
    if (!items.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "Henüz arama yok."; list.append(li); return;
    }
    for (const it of items) {
      const li = document.createElement("li");
      li.title = "Bu aramayı tekrar çalıştır";
      const q = document.createElement("div"); q.className = "q"; q.textContent = it.query;
      const meta = document.createElement("div"); meta.className = "meta";
      const left = document.createElement("span");
      left.textContent = `${it.site} · ${it.result_count} ürün · ${fmtDate.format(new Date(it.timestamp))}`;
      const right = document.createElement("span"); right.className = "min";
      right.textContent = it.min_price != null ? fmtPrice.format(it.min_price) : "";
      meta.append(left, right);
      li.append(q, meta);
      li.addEventListener("click", () => {
        $("query").value = it.query;
        if ([...$("site").options].some(o => o.value === it.site)) $("site").value = it.site;
        search(it.site, it.query);
      });
      list.append(li);
    }
  } catch (e) {
    list.replaceChildren();
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = "Geçmiş yüklenemedi."; list.append(li);
  }
}

async function loadSites() {
  try {
    const sites = await (await fetch("/api/sites")).json();
    if (!sites.length) return;
    const sel = $("site");
    sel.replaceChildren();
    for (const s of sites) {
      const o = document.createElement("option");
      o.value = s.site; o.textContent = s.site; o.title = s.description || "";
      sel.append(o);
    }
    if (sites.some(s => s.site === "trendyol")) sel.value = "trendyol";
  } catch { /* varsayılan trendyol kalır */ }
}

$("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("query").value.trim();
  if (!q) { $("query").focus(); return; }
  search($("site").value, q);
});

loadSites();
loadRecent();
</script>
</body>
</html>
